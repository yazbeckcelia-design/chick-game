<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pet the Chick 🐥</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
    }

    /* Floating heart and sparkle animations */
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.6) rotate(0deg);
      }
      50% {
        transform: translate(calc(-50% + (var(--dx) * 1px)), -60px) scale(1.2) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + (var(--dx) * 2px)), -120px) scale(0.8) rotate(calc(var(--rot) * 2));
      }
    }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      font-size: 1.8rem;
      z-index: 50;
    }

    /* Gentle breathe animation for idle chick */
    @keyframes idleBreathe {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.02, 0.98); }
    }

    .chick-idle {
      animation: idleBreathe 3s ease-in-out infinite;
    }

    /* Squash and stretch when petted */
    .chick-pet {
      transform: scale(1.12, 0.88) translateY(10px) !important;
      transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chick-release {
      transform: scale(0.95, 1.05) translateY(-6px);
      transition: transform 0.15s ease-out;
    }

    /* Wing Wiggle */
    @keyframes wingWiggleLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    @keyframes wingWiggleRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }

    .wiggle-wing-left {
      animation: wingWiggleLeft 0.25s ease-in-out 2;
      transform-origin: top right;
    }
    .wiggle-wing-right {
      animation: wingWiggleRight 0.25s ease-in-out 2;
      transform-origin: top left;
    }

    /* Heart beat pulse for counter */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    .pulse-heart {
      animation: heartBeat 0.3s ease-out;
    }

    /* Custom scrollbar for accessories on small screens */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-100 via-yellow-50 to-orange-100 min-h-screen flex flex-col justify-between items-center overflow-x-hidden p-3 sm:p-4">

  <!-- Header & Stats -->

    <!-- Mute / Audio Toggle Button -->

  <!-- Wardrobe & Accessory Selector -->

        <span class="text-lg">😇</span>
        <span class="text-[10px]" id="lblHalo">5,000 pets</span>
      </button>
    </div>
  </footer>

  <script>
    // Game State variables
    let petCount = 0;
    let isSoundMuted = false;
    let audioCtx = null;
    let currentBreed = 'yellow';
    let activeAccessory = 'none';
    let isPetting = false;
    let lastPetTime = 0;

    // Load saved data from localStorage
    function loadSavedGame() {
      const savedCount = localStorage.getItem('chickPetCount');
      if (savedCount !== null) {
        petCount = parseInt(savedCount, 10) || 0;
      }

      const savedBreed = localStorage.getItem('chickBreed');
      if (savedBreed && breedConfigs[savedBreed]) {
        currentBreed = savedBreed;
      }

      const savedMute = localStorage.getItem('chickSoundMuted');
      if (savedMute !== null) {
        isSoundMuted = savedMute === 'true';
      }

      const savedAccessory = localStorage.getItem('chickAccessory');
      if (savedAccessory) {
        activeAccessory = savedAccessory;
      }
    }

    // Save game state to localStorage
    function saveGame() {
      localStorage.setItem('chickPetCount', petCount);
      localStorage.setItem('chickBreed', currentBreed);
      localStorage.setItem('chickSoundMuted', isSoundMuted);
      localStorage.setItem('chickAccessory', activeAccessory);
    }

    // Breed Configurations
    const breedConfigs = {
      yellow: {
        name: "Classic Yellow Chick 🐥",
        bodyFill: "#fde047",
        bodyStroke: "#eab308",
        wingFill: "#fde047",
        wingStroke: "#eab308",
        beakFill: "#f97316",
        beakStroke: "#ea580c"
      },
      black: {
        name: "Shadow Black Chick 🖤",
        bodyFill: "#334155",
        bodyStroke: "#0f172a",
        wingFill: "#1e293b",
        wingStroke: "#0f172a",
        beakFill: "#d97706",
        beakStroke: "#b45309"
      },
      gray: {
        name: "Feather Gray Chick 🩶",
        bodyFill: "#cbd5e1",
        bodyStroke: "#64748b",
        wingFill: "#94a3b8",
        wingStroke: "#64748b",
        beakFill: "#f97316",
        beakStroke: "#ea580c"
      },
      white: {
        name: "Snow White Chick ⚪",
        bodyFill: "#ffffff",
        bodyStroke: "#cbd5e1",
        wingFill: "#f8fafc",
        wingStroke: "#cbd5e1",
        beakFill: "#fb923c",
        beakStroke: "#ea580c"
      }
    };

    // Audio Synthesizer via Web Audio API
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChirpSound() {
      if (isSoundMuted) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        const now = ctx.currentTime;
        const startFreq = 2200 + Math.random() * 400;
        const endFreq = 3100 + Math.random() * 300;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    function playUnlockSound() {
      if (isSoundMuted) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.15);
        });
      } catch (e) {}
    }

    // Handle Petting Interaction
    function handlePet(e) {
      if (e) e.preventDefault();

      const now = Date.now();
      if (now - lastPetTime < 50) return;
      lastPetTime = now;

      petCount++;
      petCountEl.textContent = petCount.toLocaleString();

      saveGame();

      heartIcon.classList.remove('pulse-heart');
      void heartIcon.offsetWidth;
      heartIcon.classList.add('pulse-heart');

      playChirpSound();

      chickContainer.classList.remove('chick-idle', 'chick-release');
      chickContainer.classList.add('chick-pet');

      eyesNormal.classList.add('hidden');
      eyesHappy.classList.remove('hidden');

      leftWing.classList.remove('wiggle-wing-left');
      rightWing.classList.remove('wiggle-wing-right');
      void leftWing.offsetWidth;
      leftWing.classList.add('wiggle-wing-left');
      rightWing.classList.add('wiggle-wing-right');

      let clientX, clientY;
      if (e && e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e && e.clientX) {
        clientX = e.clientX;
        clientY = e.clientY;
      } else {
        const rect = chickContainer.getBoundingClientRect();
        clientX = rect.left + rect.width / 2;
        clientY = rect.top + rect.height / 3;
      }

      spawnParticles(clientX, clientY);
      updateProgress();

      if (petCount % 3 === 0) {
        const randomPhrase = happyPhrases[Math.floor(Math.random() * happyPhrases.length)];
        speechBubble.textContent = randomPhrase;
        speechBubble.classList.add('scale-110');
        setTimeout(() => speechBubble.classList.remove('scale-110'), 200);
      }

      clearTimeout(chickContainer.releaseTimer);
      chickContainer.releaseTimer = setTimeout(() => {
        chickContainer.classList.remove('chick-pet');
        chickContainer.classList.add('chick-release');
        eyesHappy.classList.add('hidden');
        eyesNormal.classList.remove('hidden');

        setTimeout(() => {
          chickContainer.classList.remove('chick-release');
          chickContainer.classList.add('chick-idle');
        }, 150);
      }, 200);
    }

    // Spawn Hearts & Sparkles Particles
    function spawnParticles(x, y) {
      const symbols = ['❤️', '💖', '✨', '💛', '🌸', '⭐', '💎'];
      const count = Math.floor(Math.random() * 2) + 2;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        const dx = (Math.random() - 0.5) * 100;
        const rot = (Math.random() - 0.5) * 60;

        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--rot', rot + 'deg');
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        particleContainer.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 1150);
      }
    }

        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed', 'bg-gray-100', 'border-gray-200');
        btn.classList.add('bg-amber-100', 'border-amber-300', 'hover:bg-amber-200', 'text-amber-900');

        if (!isInitialLoad) playUnlockSound();
      }
