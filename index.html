<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet The Chick Studio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #fffdf0;
      padding: 20px;
      margin: 0;
      user-select: none;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .chick-selector {
      margin-bottom: 15px;
    }

    .chick-btn {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 20px;
      border: 2px solid #ccc;
      cursor: pointer;
      background: white;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .chick-btn.active {
      background: #ffe066;
      border-color: #f59f00;
      transform: scale(1.05);
    }

    #scoreDisplay {
      font-size: 24px;
      color: #f59f00;
      margin: 10px 0;
    }

    /* Interactive Chick Container */
    #chickContainer {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin: 20px auto;
      padding: 20px;
    }

    #chickSprite {
      font-size: 110px;
      transition: transform 0.1s ease;
      display: inline-block;
    }

    #accessoryLayer {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
      pointer-events: none;
    }

    /* Accessory Grid */
    .accessories-title {
      margin-top: 25px;
      color: #444;
    }

    #accessoriesGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-width: 600px;
      margin: 15px auto;
      max-height: 320px;
      overflow-y: auto;
      border: 2px solid #ffe066;
      padding: 12px;
      border-radius: 16px;
      background: white;
    }

    .acc-card {
      border: 2px solid #eee;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .acc-card.unlocked {
      background: #e6fcf5;
      border-color: #20c997;
      cursor: pointer;
    }

    .acc-card.locked {
      opacity: 0.4;
      background: #f8f9fa;
    }

    .acc-card.equipped {
      border-color: #339af0;
      background: #e7f5ff;
      box-shadow: 0 0 8px rgba(51, 154, 240, 0.4);
    }
  </style>
</head>
<body>

  <h1>🐣 Pet The Chick Studio 🐥</h1>

  <!-- Select Chick -->
  <div class="chick-selector">
    <button class="chick-btn active" id="btnOreo" onclick="selectChick('Oreo')">🖤 Oreo</button>
    <button class="chick-btn" id="btnSnowy" onclick="selectChick('Snowy')">🤍 Snowy</button>
  </div>

  <h2 id="scoreDisplay">Oreo's Points: 0</h2>

  <!-- Petting Area -->
  <div id="chickContainer" onclick="petChick()">
    <div id="accessoryLayer"></div>
    <div id="chickSprite">🐥</div>
  </div>

  <h3 class="accessories-title">🎒 Milestone Accessories (30 Unlocks)</h3>
  <div id="accessoriesGrid"></div>

  <script>
    // 30 Milestone Accessories (Unlocks every 10-30 points!)
    const milestoneAccessories = [
      { id: "acc_1", name: "Red Hat", icon: "🎩", requiredScore: 10 },
      { id: "acc_2", name: "Cool Shades", icon: "🕶️", requiredScore: 20 },
      { id: "acc_3", name: "Bowtie", icon: "👔", requiredScore: 30 },
      { id: "acc_4", name: "Unicorn Friend", icon: "🦄", requiredScore: 40 },
      { id: "acc_5", name: "Sparkles", icon: "✨", requiredScore: 50 },
      { id: "acc_6", name: "Crown", icon: "👑", requiredScore: 60 },
      { id: "acc_7", name: "Glasses", icon: "👓", requiredScore: 70 },
      { id: "acc_8", name: "Shirt", icon: "👕", requiredScore: 80 },
      { id: "acc_9", name: "Kitty Pal", icon: "🐱", requiredScore: 90 },
      { id: "acc_10", name: "Star Power", icon: "🌟", requiredScore: 100 },
      { id: "acc_11", name: "Goggles", icon: "🥽", requiredScore: 120 },
      { id: "acc_12", name: "Safety Vest", icon: "🦺", requiredScore: 140 },
      { id: "acc_13", name: "Puppy Pal", icon: "🐶", requiredScore: 160 },
      { id: "acc_14", name: "Fire Aura", icon: "🔥", requiredScore: 180 },
      { id: "acc_15", name: "Cap", icon: "🧢", requiredScore: 200 },
      { id: "acc_16", name: "Silly Nose", icon: "🥸", requiredScore: 230 },
      { id: "acc_17", name: "Karate Belt", icon: "🥋", requiredScore: 260 },
      { id: "acc_18", name: "Fox Pal", icon: "🦊", requiredScore: 290 },
      { id: "acc_19", name: "Lightning", icon: "⚡", requiredScore: 320 },
      { id: "acc_20", name: "Grad Hat", icon: "🎓", requiredScore: 350 },
      { id: "acc_21", name: "Bunny Pal", icon: "🐰", requiredScore: 390 },
      { id: "acc_22", name: "Rainbow", icon: "🌈", requiredScore: 430 },
      { id: "acc_23", name: "Helmet", icon: "🪖", requiredScore: 470 },
      { id: "acc_24", name: "Panda Pal", icon: "🐼", requiredScore: 510 },
      { id: "acc_25", name: "Diamond", icon: "💎", requiredScore: 550 },
      { id: "acc_26", name: "Sun Hat", icon: "👒", requiredScore: 600 },
      { id: "acc_27", name: "Dragon Pal", icon: "🐲", requiredScore: 650 },
      { id: "acc_28", name: "Snowflake", icon: "❄️", requiredScore: 700 },
      { id: "acc_29", name: "Ribbon", icon: "🎀", requiredScore: 800 },
      { id: "acc_30", name: "Glitch Crown", icon: "👑✨", requiredScore: 1000 }
    ];

    let currentChick = "Oreo";
    
    // Load Scores from LocalStorage
    let chickScores = {
      Oreo: parseInt(localStorage.getItem('chickScore_Oreo')) || 0,
      Snowy: parseInt(localStorage.getItem('chickScore_Snowy')) || 0
    };

    // Load Equipped Accessories per Chick from LocalStorage
    let equippedAccessories = {
      Oreo: localStorage.getItem('equippedAccessory_Oreo') || "",
      Snowy: localStorage.getItem('equippedAccessory_Snowy') || ""
    };

    // Load Unlocked Items List from LocalStorage
    let unlockedAccessories = JSON.parse(localStorage.getItem('unlockedAccessories')) || [];

    function saveAllData() {
      // Save point scores
      localStorage.setItem(`chickScore_Oreo`, chickScores.Oreo);
      localStorage.setItem(`chickScore_Snowy`, chickScores.Snowy);

      // Save equipped items
      localStorage.setItem(`equippedAccessory_Oreo`, equippedAccessories.Oreo);
      localStorage.setItem(`equippedAccessory_Snowy`, equippedAccessories.Snowy);

      // Save list of unlocked items
      localStorage.setItem('unlockedAccessories', JSON.stringify(unlockedAccessories));
    }

    function selectChick(name) {
      currentChick = name;
      document.getElementById("btnOreo").classList.toggle("active", name === "Oreo");
      document.getElementById("btnSnowy").classList.toggle("active", name === "Snowy");
      updateUI();
      renderAccessories();
    }

    function checkMilestoneUnlocks() {
      const currentScore = chickScores[currentChick];
      
      milestoneAccessories.forEach(item => {
        if (currentScore >= item.requiredScore && !unlockedAccessories.includes(item.id)) {
          unlockedAccessories.push(item.id);
        }
      });

      saveAllData(); // Save changes automatically whenever milestones are hit!
    }

    function petChick() {
      // Add point without spending anything
      chickScores[currentChick]++;

      // Tap bouncing animation
      const sprite = document.getElementById("chickSprite");
      sprite.style.transform = "scale(1.2) rotate(6deg)";
      setTimeout(() => sprite.style.transform = "scale(1) rotate(0deg)", 100);

      checkMilestoneUnlocks();
      updateUI();
      renderAccessories();
    }

    function equipItem(icon) {
      if (equippedAccessories[currentChick] === icon) {
        equippedAccessories[currentChick] = ""; // Take off if tapped again
      } else {
        equippedAccessories[currentChick] = icon;
      }
      
      saveAllData(); // Save changes automatically!
      updateUI();
      renderAccessories();
    }

    function updateUI() {
      const currentScore = chickScores[currentChick];
      document.getElementById("scoreDisplay").textContent = `${currentChick}'s Points: ${currentScore}`;
      document.getElementById("accessoryLayer").textContent = equippedAccessories[currentChick];
    }

    function renderAccessories() {
      const grid = document.getElementById("accessoriesGrid");
      grid.innerHTML = "";

      milestoneAccessories.forEach(item => {
        // Check if unlocked either by saved list or current point score
        const isUnlocked = unlockedAccessories.includes(item.id) || chickScores[currentChick] >= item.requiredScore;
        const isEquipped = equippedAccessories[currentChick] === item.icon;

        const card = document.createElement("div");
        card.className = `acc-card ${isUnlocked ? 'unlocked' : 'locked'} ${isEquipped ? 'equipped' : ''}`;

        card.innerHTML = `
          <div style="font-size:26px;">${item.icon}</div>
          <div style="font-size:12px; font-weight:bold; margin-top:4px;">${item.name}</div>
          <div style="font-size:11px; color:#666;">${isUnlocked ? (isEquipped ? 'Equipped' : 'Unlocked!') : item.requiredScore + ' pts'}</div>
        `;

        if (isUnlocked) {
          card.onclick = () => equipItem(item.icon);
        }

        grid.appendChild(card);
      });
    }

    // Load initial screen state and check unlocks on boot
    checkMilestoneUnlocks();
    updateUI();
    renderAccessories();
  </script>
</body>
</html>
